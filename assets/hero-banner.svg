<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="radialGlow" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#050807" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E0C" />
      <stop offset="100%" stop-color="#040605" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.4)" />
      <stop offset="50%" stop-color="rgba(6, 182, 212, 0.4)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.1)" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1" />
      <circle cx="0" cy="0" r="1" fill="rgba(16, 185, 129, 0.25)" />
    </pattern>
  </defs>

  <!-- Container Box -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="16" fill="url(#radialGlow)" />
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />
  <rect x="0.5" y="0.5" width="1199" height="379" rx="15.5" stroke="url(#borderGrad)" stroke-width="1" />

  <!-- Top System Status Header -->
  <g transform="translate(48, 44)">
    <rect width="160" height="26" rx="13" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <circle cx="16" cy="13" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Roboto, sans-serif" font-size="11" font-weight="600" fill="#10B981" letter-spacing="1">SYSTEM OPERATIONAL</text>

    <!-- Telemetry Badges -->
    <text x="180" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(148, 163, 184, 0.7)" letter-spacing="0.5">LOC: 12.9716° N, 77.5946° E</text>
    <text x="960" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#06B6D4" text-anchor="end" letter-spacing="0.5">SYS.ARCH // BUILDER 2.0</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(48, 140)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="54" font-weight="800" fill="url(#textGrad)" letter-spacing="-1.5">
      LIJO PAUL M E
    </text>
    
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="20" font-weight="600" fill="url(#accentGrad)" letter-spacing="1.5">
      ENGINEER  •  SYSTEM BUILDER  •  PROBLEM SOLVER
    </text>

    <text x="0" y="86" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="16" font-weight="400" fill="#94A3B8" letter-spacing="0.2">
      Turning ambitious ideas into production-grade products with code, AI &amp; systems engineering.
    </text>
  </g>

  <!-- Bottom Metric & Live Badges -->
  <g transform="translate(48, 305)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="34" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <circle cx="16" cy="17" r="3" fill="#10B981" />
      <text x="28" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#E2E8F0">6 LIVE DEPLOYMENTS</text>
    </g>

    <!-- Badge 2 -->
    <g transform="translate(225, 0)">
      <rect width="260" height="34" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <circle cx="16" cy="17" r="3" fill="#06B6D4" />
      <text x="28" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#E2E8F0">FULL-STACK • AI • SYSTEMS</text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(500, 0)">
      <rect width="270" height="34" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <circle cx="16" cy="17" r="3" fill="#8B5CF6" />
      <text x="28" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#E2E8F0">VERIFIED CODE PORTFOLIO</text>
    </g>
  </g>

  <!-- Decorative Corner Crosshairs -->
  <path d="M 20 20 L 20 32 M 20 20 L 32 20" stroke="rgba(16, 185, 129, 0.5)" stroke-width="1.5" />
  <path d="M 1180 20 L 1180 32 M 1180 20 L 1168 20" stroke="rgba(16, 185, 129, 0.5)" stroke-width="1.5" />
  <path d="M 20 360 L 20 348 M 20 360 L 32 360" stroke="rgba(16, 185, 129, 0.5)" stroke-width="1.5" />
  <path d="M 1180 360 L 1180 348 M 1180 360 L 1168 360" stroke="rgba(16, 185, 129, 0.5)" stroke-width="1.5" />
</svg>
